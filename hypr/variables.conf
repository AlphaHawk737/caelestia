# ### Hyprland ###

$mainMod = ALT
$mainMod_L = ALT_L

# Apps
$terminal = foot
$browser = brave --password-store=basic
$editor = codium
$fileExplorer = thunar

# Touchpad
$touchpadDisableTyping = true
$touchpadScrollFactor = 0.3
$workspaceSwipeFingers = 4
$gestureFingers = 3
$gestureFingersMore = 4

# Blur
$blurEnabled = true
$blurSpecialWs = false
$blurPopups = true
$blurInputMethods = true
$blurSize = 8
$blurPasses = 2
$blurXray = false

# Shadow
$shadowEnabled = true
$shadowRange = 20
$shadowRenderPower = 3
$shadowColour = rgba($surfaced4)

# Gaps
$workspaceGaps = 20
$windowGapsIn = 5
$windowGapsOut = 10
$singleWindowGapsOut = 20

# Window styling
$windowOpacity = 0.95
$windowRounding = 15

$windowBorderSize = 1
$activeWindowBorderColour = rgba($primarye6)
$inactiveWindowBorderColour = rgba($onSurfaceVariant11)

# Misc
$volumeStep = 10  # In percent
$cursorTheme = sweet-cursors
$cursorSize = 24


# ### Keybinds ###
# Workspaces
$kbMoveWinToWs = Ctrl+$mainMod
# $kbMoveWinToWsGroup = Ctrl+Super+Alt
$kbGoToWs = $mainMod
# $kbGoToWsGroup = Ctrl+Super

$kbNextWs = Ctrl+$mainMod, right
$kbPrevWs = Ctrl+$mainMod, left

$kbToggleSpecialWs = $mainMod, S

# Window groups
# $kbWindowGroupCycleNext = Alt, Tab
# $kbWindowGroupCyclePrev = Shift+Alt, Tab
# $kbUngroup = Super, U
# $kbToggleGroup = Super, Comma

# Window actions
$kbMoveWindow = $mainMod, Z
$kbResizeWindow = $mainMod, X
$kbWindowPip = Super+Alt, Backslash
$kbPinWindow = $mainMod, P
$kbWindowFullscreen = $mainMod, F
$kbWindowBorderedFullscreen = Super+Alt, F
$kbToggleWindowFloating = Super+Alt, Space
$kbCloseWindow = $mainMod, Q

# Special workspace toggles
$kbSystemMonitor = Ctrl+Shift, Escape
$kbMusic = $mainMod, M
$kbCommunication = $mainMod, D
$kbTodo = $mainMod, R

# Apps
$kbTerminal = $mainMod, Return
$kbBrowser = $mainMod, B
$kbEditor = $mainMod, C
$kbFileExplorer = $mainMod, E

# Misc
$kbSession = Ctrl+Alt, Delete
$kbShowSidebar = $mainMod, N
$kbClearNotifs = Ctrl+Alt, C
$kbShowPanels = $mainMod, K
$kbLock = $mainMod, L
$kbRestoreLock = Super+Alt, L
